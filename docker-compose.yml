networks:
    monitoring:
        driver: bridge

volumes:
    grafana_data:

services:
    fleet-backend:
        image: fleet-backend:latest
        build:
            context: ./fleet-backend
        ports:
            - "8080:8080"
        volumes:
            - ./fleet-backend/config.json:/app/config.json
        environment:
            - NODE_ENV=production
        networks:
            - monitoring

    fleet-ui:
        image: fleet-ui:latest
        build:
            context: ./fleet-ui
            args:
                NEXT_PUBLIC_API_URL: http://localhost:8080
        ports:
            - "3000:3000"
        depends_on:
            - fleet-backend
        networks:
            - monitoring

    prometheus:
        image: prom/prometheus:latest
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        depends_on:
            - fleet-backend
        networks:
            - monitoring

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - GF_AUTH_ORG_NAME=Main
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning/dashboards/dashboard_provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
            - ./grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
            - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json
        depends_on:
            - prometheus
        networks:
            - monitoring
